name: Publish stable release

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release-version unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: Find the latest stable release tag
        id: stable
        run: |
          tag=$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Calculate final version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          LATEST_STABLE_TAG: ${{ steps.stable.outputs.tag }}
        run: >-
          python tools/release_version.py --require-description
          --require-manual-fs25-verification --github-output "$GITHUB_OUTPUT"
      - name: Build and validate mod archive
        run: python tools/build_mod.py --version "${{ steps.version.outputs.version }}"
      - name: Render release notes from PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: >-
          python tools/release_notes.py
          --version "${{ steps.version.outputs.version }}"
          --stage final
          --pr-number "${{ github.event.pull_request.number }}"
          --pr-url "${{ github.event.pull_request.html_url }}"
          --output release-notes.md
      - name: Create archive checksum
        run: sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: >-
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt
          --target "$TARGET"
          --title "$TAG — $PR_TITLE"
          --notes-file release-notes.md
