name: Validate pull request

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, labeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run release-version unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: Validate mod metadata and source references
        run: python tools/validate_mod.py
      - name: Build and validate distributable mod archive
        run: python tools/build_mod.py --version 1.0.0-rc.1 --output-dir dist/ci
      - name: Install Lua test runtime
        run: sudo apt-get update && sudo apt-get install --yes lua5.4
      - name: Check Lua syntax
        run: find scripts -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run Lua domain tests
        run: lua5.4 tools/tests/lua/run.lua
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python tools/release_version.py --validate-title
      - name: Require a reviewed release description
        if: contains(github.event.pull_request.labels.*.name, 'release')
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: >-
          python tools/release_version.py --validate-title --require-description
          --require-manual-fs25-verification
